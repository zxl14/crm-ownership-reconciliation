name: Daily read-only reconciliation

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      BELLHAVEN_API_TOKEN: ${{ secrets.BELLHAVEN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Keep CRM writes disabled
        run: |
          if [ "${CRM_WRITES_ENABLED:-}" = "true" ]; then
            echo "CRM_WRITES_ENABLED must not be set in this workflow."
            exit 1
          fi
      - name: Refresh CRM and reconcile
        run: |
          if [ -z "${BELLHAVEN_API_TOKEN}" ]; then
            echo "BELLHAVEN_API_TOKEN is not configured. Skipping the read-only refresh."
            exit 0
          fi
          python -m src.run_daily
      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-report
          path: data/reconciliation/report.md
          if-no-files-found: ignore
